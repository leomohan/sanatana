- type: cards
  title: The Trinity of Tiruvarur
  intro: 'Three composers born within thirteen years of each other in the same temple town. Their songs are still the
    core of every concert.'
  grid: v3
  cards:
  - id: tyagaraja
    anchor: tyagaraja
    title: Tyagaraja
    subtitle: 1767–1847 · the singer of Rama
    accent: trinity
    tags: trinity
    body: Born Kakarla Tyagabrahmam into a Telugu family, he spent most of his life in Thiruvaiyaru on the Kaveri, singing
      to Rama. Tradition says he turned down a court appointment rather than sing for a king. His songs speak directly
      to God, often in the first person, and gave many ragas their lasting shape.
    facts:
    - [Language, 'Telugu, some Sanskrit']
    - [Signature, Tyagaraja]
    - [Known for, 'The five Pancharatna kritis · the musical plays Prahlada Bhakti Vijayam and Nauka Charitram']
    - [Today, 'Every January, at the Aradhana at his samadhi in Thiruvaiyaru, musicians sing the Pancharatnas together']
    chips: [Rama bhakti, Pancharatna, Thiruvaiyaru]
  - id: dikshitar
    anchor: dikshitar
    title: Muthuswami Dikshitar
    subtitle: 1775–1835 · the scholar-poet
    accent: trinity
    tags: trinity
    body: A veena player who studied for years in Varanasi, Dikshitar travelled from shrine to shrine and composed in
      Sanskrit for the deity of each. His kritis are slow and stately, dense with temple lore. He named ragas by the
      older scheme of Venkatamakhin. He even set Sanskrit words to Western tunes he heard from military bands.
    facts:
    - [Language, 'Sanskrit, some Manipravalam']
    - [Signature, Guruguha]
    - [Known for, 'The Kamalamba Navavarana kritis · the <a href="navagraha.html">Navagraha kritis</a>, one for each planet
        · the nottuswara songs']
    - [Born, 'Tiruvarur, 1775 (some sources say 1776) · died at Ettayapuram']
    chips: [Sanskrit, Navagraha kritis, Veena]
  - id: syama-sastri
    anchor: syama-sastri
    title: Syama Sastri
    subtitle: 1762–1827 · the poet of Kamakshi
    accent: trinity
    tags: trinity
    body: The eldest of the three, born Venkata Subrahmanya into a family of priests who served the goddess Bangaru Kamakshi
      and had carried her image south from Kanchi. He settled with her in Thanjavur. He composed fewer songs than the
      other two, about three hundred, but his rhythmic craft is unmatched.
    facts:
    - [Language, 'Telugu, also Sanskrit and Tamil']
    - [Signature, Syama Krishna]
    - [Known for, 'Three great swarajatis in Bhairavi, Todi and Yadukulakambhoji · intricate talas such as Misra Chapu']
    chips: [Kamakshi, Swarajati, Tala]
- type: cards
  title: Before the Trinity
  grid: v2
  cards:
  - id: annamacharya
    anchor: annamacharya
    title: Annamacharya
    subtitle: 1408–1503 · Tirumala
    accent: pioneer
    tags: pioneer
    body: The earliest major composer in the tradition, a singer of Lord Venkateswara at Tirumala. By tradition he composed
      32,000 songs (<em>sankirtanas</em>) in Telugu. Thousands survive, engraved on copper plates kept at the temple.
    chips: [Telugu, Venkateswara, Copper plates]
  - id: purandara
    anchor: purandara
    title: Purandara Dasa
    subtitle: 1484–1564 · the grandfather of Carnatic music
    accent: pioneer
    tags: pioneer
    body: A wealthy merchant who gave everything away to become a wandering Haridasa singer. He wrote in Kannada with
      the signature <em>Purandara Vittala</em>. He also laid out the graded exercises that every student still begins
      with, set in Mayamalavagowla (No. 15 below). For this he is called the <em>Pitamaha</em>, the grandfather.
    chips: [Kannada, Haridasa, First lessons]
  - id: kshetrayya
    anchor: kshetrayya
    title: Kshetrayya
    subtitle: c. 17th century · the padam
    accent: pioneer
    tags: pioneer
    body: A master of the <em>padam</em>, a slow love song in Telugu addressed to Krishna as Muvva Gopala. Dancers still
      use his padams for expressive dance (<em>abhinaya</em>).
    chips: [Telugu, Padam, Dance]
  - id: arunachala
    anchor: arunachala
    title: Arunachala Kavi
    subtitle: 1711–1779 · the Rama Natakam
    accent: pioneer
    tags: pioneer
    body: One of the Tamil Trinity, with Muthu Thandavar and Marimutthu Pillai, who composed in Tamil before the
      great three. His <em>Rama Natakam</em> tells the whole Ramayana in songs, drawing on Kamban. It is still sung in
      concerts. See the <a href="ramayana.html">Ramayana journey</a>.
    chips: [Tamil, Rama Natakam, Kamban]
- type: cards
  title: After the Trinity
  grid: v2
  cards:
  - id: swathi
    anchor: swathi
    title: Swathi Thirunal
    subtitle: 1813–1846 · the composer-king
    accent: later
    tags: later
    body: Maharaja of Travancore, who in a short life composed in Sanskrit, Malayalam, Telugu, Kannada and Hindustani.
      His court drew musicians from across the south.
    chips: [Travancore, Many languages]
  - id: gk-bharati
    anchor: gk-bharati
    title: Gopalakrishna Bharati
    subtitle: 1811–1896 · Nandanar Charitram
    accent: later
    tags: later
    body: His <em>Nandanar Charitram</em> tells in Tamil songs the life of Nandanar, one of the sixty-three <a href="an.html">Nayanmars</a>.
      Nandanar was born outcaste and longed to see the dancing Shiva of Chidambaram.
    chips: [Tamil, Nandanar, Musical drama]
  - id: papanasam
    anchor: papanasam
    title: Papanasam Sivan
    subtitle: 1890–1973 · the Tamil Tyagaraja
    accent: later
    tags: later
    body: He wrote hundreds of Tamil kritis that now stand beside the Telugu classics in every concert, and he also composed
      for early Tamil cinema. Admirers called him the Tamil Tyagaraja.
    chips: [Tamil kritis, Film music]
  - id: balamurali
    anchor: balamurali
    title: M. Balamuralikrishna
    subtitle: 1930–2016 · composer in all 72
    accent: later
    tags: later
    body: A child prodigy who had composed in all 72 melakartas by the age of fifteen. He went on to invent new ragas
      of only three or four notes, such as Lavangi and Mahati, and to bring the viola into Carnatic music.
    chips: [72 melakartas, New ragas, Viola]
