- type: pairs
  title: Where 72 scales come from
  intro: A melakarta is a parent scale that uses all seven swaras once each, going up and coming down. There are only
    so many ways to choose them.
  items:
  - {title: Sa and Pa are fixed, color: mela, text: 'The tonic Sa and the fifth Pa never change. Every scale keeps both.'}
  - {title: 'Ri and Ga: six pairs', color: mela, text: 'Ri and Ga have three positions each but share pitches, so they
      can be paired six ways: R1 G1, R1 G2, R1 G3, R2 G2, R2 G3, R3 G3. These are the six rows of each half below.'}
  - {title: 'Da and Ni: six pairs', color: mela, text: 'Da and Ni pair up the same six ways. These are the six columns.'}
  - {title: 'Ma: two choices', color: mela, text: 'Shuddha Ma (M1) gives scales 1–36 and Prati Ma (M2) gives 37–72.
      So 6 × 6 × 2 = 72.'}
- type: callout
  text: '🔢 <strong>The number is in the name.</strong> Each name encodes its own number by the <em>katapayadi</em> system,
    which gives every consonant a digit. Take the first two syllables, read the digits, and reverse them. <em>Ha-ri</em>kambhoji
    gives 8 and 2, so 28. <em>Me-cha</em>kalyani gives 5 and 6, so 65. The scheme of 72 was worked out by Venkatamakhin
    in the 17th century. The names used today, with complete scales, were standardised after him and are associated
    with Govindacharya.'
- type: melakarta
  anchor: melakartas
  title: The 72 Melakartas
  intro: Rows are the twelve chakras and columns the Da–Ni pairs. Every scale in a row shares Ri, Ga and Ma; every
    scale in a column shares Da and Ni. ★ marks a few you will hear often; hover over one to see why. ▶ opens the scale in Raga Geometry.
  color: mela
  halves: ['Shuddha Madhyama (M1) · Melakartas 1–36', 'Prati Madhyama (M2) · Melakartas 37–72']
  chakras: [Indu, Netra, Agni, Veda, Bana, Rutu, Rishi, Vasu, Brahma, Disi, Rudra, Aditya]
  names: [Kanakangi, Ratnangi, Ganamurti, Vanaspati, Manavati, Tanarupi, Senavati, Hanumatodi, Dhenuka, Natakapriya,
    Kokilapriya, Rupavati, Gayakapriya, Vakulabharanam, Mayamalavagowla, Chakravakam, Suryakantam, Hatakambari, Jhankaradhvani,
    Natabhairavi, Keeravani, Kharaharapriya, Gourimanohari, Varunapriya, Mararanjani, Charukesi, Sarasangi, Harikambhoji,
    Dheerashankarabharanam, Naganandini, Yagapriya, Ragavardhini, Gangeyabhushani, Vagadheeswari, Shulini, Chalanata,
    Salagam, Jalarnavam, Jhalavarali, Navaneetam, Pavani, Raghupriya, Gavambhodi, Bhavapriya, Shubhapantuvarali, Shadvidhamargini,
    Suvarnangi, Divyamani, Dhavalambari, Namanarayani, Kamavardhini, Ramapriya, Gamanashrama, Vishwambari, Shamalangi,
    Shanmukhapriya, Simhendramadhyamam, Hemavati, Dharmavati, Neetimati, Kantamani, Rishabhapriya, Latangi, Vachaspati,
    Mechakalyani, Chitrambari, Sucharitra, Jyotiswarupini, Dhatuvardhani, Nasikabhushani, Kosalam, Rasikapriya]
  famous:
    8: Todi — a vast, grave concert raga
    15: The scale of Purandara Dasa's first lessons
    21: Keeravani — the harmonic minor
    22: Kharaharapriya — Tyagaraja made it a concert mainstay
    28: Harikambhoji — parent of Mohanam and Kambhoji
    29: Shankarabharanam — same notes as the Western major scale
    51: Kamavardhini — better known as Pantuvarali
    56: Shanmukhapriya — a favourite for lively kritis
    65: Mechakalyani — Kalyani, among the most loved ragas
  play: {8: todi, 15: mayamalavagowla, 22: kharaharapriya, 29: shankarabharanam, 65: kalyani}
