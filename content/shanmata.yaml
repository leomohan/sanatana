  h1: The Shanmata
  intro: Six major sectarian traditions of Hinduism, each centered on a primary deity and a body of scripture. Traditionally
    attributed to Adi Shankara as a framework of worship — six paths, one ultimate reality. Not to be confused with
    the six <em>darshanas</em> (philosophical schools).
