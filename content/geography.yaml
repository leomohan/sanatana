  note: <strong>About this map:</strong> The 108 Divya Desams are the Vishnu abodes sung by the twelve Azhwars in
    the <em>Nalayira Divya Prabandham</em>. Of these, 106 are earthly temples concentrated in Tamil Nadu, Kerala,
    and northern India, with two (Thiruparkadal and Sri Vaikuntham) considered celestial and not mapped here. This
    map shows a representative set of 20 Divya Desams alongside all 12 Jyotirlingas. The 12 Jyotirlingas are the
    self-manifested shrines of Shiva scattered across India, from Somnath on the Arabian Sea to Kedarnath in the
    Himalayas. Coordinates are approximate temple locations; some Divya Desams share the same town and may overlap
    at this zoom level.
