  layout: page
  title: Shakti Peethas — Where Sati Fell
  description: Interactive map of the 18 Maha Shakti Peethas and the four Adi Shakti Peethas, with the legend of
    Sati and Daksha's sacrifice.
  favicon: 🌺
  search: Search goddesses, places, body parts…
