    anchor: true
    title: Mahalakshmi
    native: महालक्ष्मी
    subtitle: Kolhapur, Maharashtra
    num: '7'
    accent: '#e84393'
    tags: maha west
    body: Known locally as Ambabai, the goddess of the Karvir or Shri Pitham. On a few days each year the setting
      sun's rays reach her image through the temple doors (Kiranotsav). One of the "three and a half" Shakti Peethas
      of Maharashtra.
    facts:
    - [Goddess, Mahalakshmi]
    - [Body part, Eye]
    - [Place, 'Kolhapur, Maharashtra']
    chips:
    - {text: Maharashtra, style: event}
    - Kiranotsav
    map: {lat: 16.695, lng: 74.2236, popup: 'Eye · Kolhapur, Maharashtra', name: Mahalakshmi — Kolhapur}
