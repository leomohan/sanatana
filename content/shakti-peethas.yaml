    native: बिरजा
    subtitle: Jajpur, Odisha
    num: '11'
    accent: '#e84393'
    tags: maha east
    body: The Oddiyana Pitham. Jajpur is also called Viraja Kshetra and Nabhi Gaya, and pilgrims perform ancestral
