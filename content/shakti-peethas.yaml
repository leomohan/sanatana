    accent: '#e84393'
    tags: maha south
    body: Her shrine stands inside the Kukkuteswara temple complex. The name means "she who was worshipped by Indra
      (Puruhuta)". Pithapuram is also a Pada Gaya kshetra for ancestral rites and the birthplace of Sripada Sri
      Vallabha.
