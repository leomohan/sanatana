  - id: shankari
    anchor: true
    title: Shankari
    native: शाङ्करी
    subtitle: Trincomalee, Sri Lanka
    num: '1'
    accent: '#e84393'
    tags: maha south
    body: The first name in the stotra, "Lankayam Shankari Devi". The original site is historically unknown; modern
      tradition places it at the clifftop Koneswaram temple in Trincomalee, destroyed by the Portuguese in the 17th
      century and rebuilt in the 20th.
    facts:
    - [Goddess, Shankari]
    - [Body part, Groin]
    - [Place, 'Trincomalee, Sri Lanka']
    chips:
    - {text: Sri Lanka, style: event}
    - Site uncertain
    map: {lat: 8.5833, lng: 81.2453, popup: 'Groin · Trincomalee, Sri Lanka', name: Shankari — Trincomalee}
  - id: kamakshi
    anchor: true
    title: Kamakshi
    native: कामाक्षी
    subtitle: Kanchipuram, Tamil Nadu
    num: '2'
    accent: '#e84393'
    tags: maha south
    body: The Kamakoti Pitham, one of the great Devi temples of the south, where the goddess sits in a yogic posture.
      Kanchipuram also holds the earth temple of the <a href="pancha-bhoota.html">Pancha Bhoota Sthalams</a>, whose
      legend has Kamakshi embracing Shiva's sand lingam.
    facts:
    - [Goddess, Kamakshi]
    - [Body part, Part of the abdomen]
    - [Place, 'Kanchipuram, Tamil Nadu']
    chips:
    - {text: Tamil Nadu, style: event}
    - Kamakoti Pitham
    map: {lat: 12.8408, lng: 79.7031, popup: 'Part of the abdomen · Kanchipuram, Tamil Nadu', name: Kamakshi — Kanchipuram}
  - id: shrinkhala
    anchor: true
    title: Shrinkhala
    native: शृङ्खला
    subtitle: Pandua, Hooghly district, West Bengal
    num: '3'
    accent: '#e84393'
    tags: maha east
    body: The least certain of the eighteen. The stotra places Shrinkhala at "Pradyumna"; most lists identify this
      with Pandua in Hooghly district, but the original shrine and its exact site are debated.
    facts:
    - [Goddess, Shrinkhala]
    - [Body part, Part of the stomach]
    - [Place, 'Pandua, Hooghly district, West Bengal']
    chips:
    - {text: West Bengal, style: event}
    - Site debated
    map: {lat: 23.08, lng: 88.2783, popup: 'Part of the stomach · Pandua, Hooghly district, West Bengal', name: Shrinkhala
        — Pandua}
  - id: chamundeshwari
    anchor: true
    title: Chamundeshwari
    native: चामुण्डेश्वरी
    subtitle: Chamundi Hills, Mysuru, Karnataka
    num: '4'
    accent: '#e84393'
    tags: maha south
    body: The hilltop temple of the goddess who slew Mahishasura, the buffalo demon from whom Mysuru (Mahishuru)
      takes its name. She was the family deity of the Wodeyar kings and is the centre of the city's Dasara festival.
    facts:
    - [Goddess, Chamundeshwari]
    - [Body part, Hair]
    - [Place, 'Chamundi Hills, Mysuru, Karnataka']
    chips:
    - {text: Karnataka, style: event}
    - Mysuru Dasara
    map: {lat: 12.2724, lng: 76.6705, popup: 'Hair · Chamundi Hills, Mysuru, Karnataka', name: Chamundeshwari —
        Chamundi Hills}
  - id: jogulamba
    anchor: true
    title: Jogulamba
    native: जोगुलाम्बा
    subtitle: Alampur, Telangana
    num: '5'
    accent: '#e84393'
    tags: maha south
    body: At Alampur, near the meeting of the Tungabhadra and Krishna, beside the Navabrahma temples built by the
      Badami Chalukyas in the 7th–8th centuries. The temple was rebuilt on its old site in 2005 and the original
      image reinstalled.
    facts:
    - [Goddess, Jogulamba]
    - [Body part, Teeth]
    - [Place, 'Alampur, Telangana']
    chips:
    - {text: Telangana, style: event}
    - Navabrahma temples
    map: {lat: 15.877, lng: 78.132, popup: 'Teeth · Alampur, Telangana', name: Jogulamba — Alampur}
  - id: bhramaramba
    anchor: true
    title: Bhramaramba
    native: भ्रमराम्बा
    subtitle: Srisailam, Andhra Pradesh
    num: '6'
    accent: '#e84393'
    tags: maha south
    body: On the Nallamala hills above the Krishna, Srisailam is both a Shakti Peetha and one of the twelve Jyotirlingas
      (Mallikarjuna) — see the <a href="geography.html">Sacred Geography</a> map. The goddess is named for the bee
      (<em>bhramara</em>) form she took to destroy a demon.
    facts:
    - [Goddess, Bhramaramba]
    - [Body part, Neck]
    - [Place, 'Srisailam, Andhra Pradesh']
    chips:
    - {text: Andhra Pradesh, style: event}
    - Also a Jyotirlinga
    map: {lat: 16.0742, lng: 78.8682, popup: 'Neck · Srisailam, Andhra Pradesh', name: Bhramaramba — Srisailam}
