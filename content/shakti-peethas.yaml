blocks:
- type: story
  title: The legend of Sati
  paragraphs: ['Daksha Prajapati held a great sacrifice and pointedly left out his daughter Sati and her husband
      Shiva. Sati went anyway, was insulted by her father before the assembly, and gave up her body — in some tellings
      by entering the sacrificial fire, in others through yogic power. Shiva, in fury, sent Virabhadra to destroy
      the sacrifice.', 'Grief-stricken, Shiva wandered the cosmos carrying Sati''s body. In one version Vishnu cut
      it into pieces with his Sudarshana Chakra; in another the limbs and ornaments simply fell as Shiva walked.
      Wherever a part came to rest, the Goddess is worshipped — usually alongside a guardian form of Shiva called
      Bhairava.']
