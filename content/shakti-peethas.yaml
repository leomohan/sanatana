    subtitle: Nilachal hill, Guwahati, Assam
    num: '13'
    accent: '#e84393'
    tags: maha east adi
    body: 'There is no image: the goddess is worshipped as a natural cleft in the rock, kept moist by an underground
      spring. The temple closes for the Ambubachi Mela each June. Kamakhya is counted among both the eighteen Maha
      and the four Adi Shakti Peethas.'
    facts:
