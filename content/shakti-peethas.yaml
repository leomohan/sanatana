    num: '8'
    accent: '#e84393'
    tags: maha west
    body: A hill temple to Renuka, mother of Parashurama, in a town also sacred to Dattatreya. The Devi Gita names
      it Matripura. It too is one of Maharashtra's "three and a half" Shakti Peethas.
    facts:
    - [Goddess, Renuka (Ekaveera)]
    - [Body part, Left hand]
    - [Place, 'Mahur, Nanded district, Maharashtra']
