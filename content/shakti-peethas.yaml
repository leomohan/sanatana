  h1: Shakti Peethas
  intro: The seats of the Goddess, each marking where a part of Sati's body — or one of her ornaments — is said
    to have fallen. This map follows the eighteen Maha Shakti Peethas of the hymn traditionally attributed to Adi
    Shankara, from Sri Lanka to Kashmir, and adds the four Adi ("first") Peethas.
