- type: callout
  text: '🧬 Since the late 19th century some writers have read the sequence as a parable of evolution: fish, amphibian,
    mammal, half-human, small human, then full humans. It is a modern reading. The Puranas present the avatars as
    rescues of dharma at moments of crisis, not as stages of biology.'
