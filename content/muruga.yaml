- type: cards
  cards:
  - id: thiruparankundram
    anchor: true
    title: Thiruparankundram
    native: திருப்பரங்குன்றம்
    subtitle: The Wedding Abode
    num: '1'
    accent: muruga
    tags: wedding
    body: Carved into a hillock near Madurai, this is where Muruga married Deivanai, the daughter of Indra. It is
      the first of the six abodes and a rare rock-cut temple where the sanctum is hewn from living stone.
    chips:
    - {text: 💍 Wedding, style: event}
    - Madurai
    journey: {label: Thiruparankundram, sub: Wedding}
    map: {lat: 9.879, lng: 78.07, popup: Wedding to Deivanai · near Madurai}
  - id: thiruchendur
    anchor: true
    title: Thiruchendur
    native: திருச்செந்தூர்
    subtitle: The Victory Abode
    num: '2'
    accent: muruga
    tags: victory
    body: The only abode on the seashore. Here Muruga defeated the demon Surapadma after a fierce battle, and worshipped
      Shiva in gratitude. The temple stands just 200 metres from the Gulf of Mannar, yet is said never to flood.
    chips:
    - {text: ⚔️ Victory, style: event}
    - Coastal
    - Skanda Sashti
    journey: {label: Thiruchendur, sub: Victory}
    map: {lat: 8.4958, lng: 78.1292, popup: Victory over Surapadma · coastal}
  - id: palani
    anchor: true
    title: Palani
    native: பழனி
    subtitle: The Abode of Renunciation
    num: '3'
    accent: muruga
    tags: renunciation
    body: After losing the contest for the sacred fruit to his brother Ganesha, Muruga left his family in anger
      and settled on these hills as an ascetic. Here he is worshipped as Dhandayuthapani — the Lord with a staff,
      wearing only a loincloth.
    chips:
    - {text: 🧘 Renunciation, style: event}
    - Hilltop
    - Navapashanam idol
    journey: {label: Palani, sub: Renunciation}
    map: {lat: 10.4388, lng: 77.5203, popup: Renunciation · Dhandayuthapani}
  - id: swamimalai
    anchor: true
    title: Swamimalai
    native: சுவாமிமலை
    subtitle: The Abode of Wisdom
    num: '4'
    accent: muruga
    tags: wisdom
    body: At this hillock near Kumbakonam, the child Muruga taught the meaning of the Pranava Mantra (Om) to his
      own father, Shiva — and demanded that Shiva accept him as guru. Sixty steps lead to the shrine, one for each
      year of the Hindu calendar cycle.
    chips:
    - {text: 🧠 Wisdom, style: event}
    - Guru of Shiva
    - 60 steps
    journey: {label: Swamimalai, sub: Wisdom}
    map: {lat: 10.9561, lng: 79.3248, popup: Taught Om to Shiva · near Kumbakonam}
  - id: thiruthani
    anchor: true
    title: Thiruthani
    native: திருத்தணி
    subtitle: The Abode of Union
    num: '5'
    accent: muruga
    tags: union
    body: On this hill near Chennai, Muruga married Valli, the daughter of a tribal chieftain — a union celebrated
      as the blending of divine grace with the devotion of the humble. Its great festival is Aadi Krithigai, and
      pilgrims climb its 365 steps on New Year's Eve.
    chips:
    - {text: 💞 Union, style: event}
    - Valli
    - Aadi Krithigai
    journey: {label: Thiruthani, sub: Union}
    map: {lat: 13.178, lng: 79.608, popup: Marriage to Valli · near Chennai}
  - id: pazhamudircholai
    anchor: true
    title: Pazhamudircholai
    native: பழமுதிர்சோலை
    subtitle: The Forest Abode
    num: '6'
    accent: muruga
    tags: wisdom
    body: Nestled in the Azhagar Kovil forests near Madurai, this is the last of the six abodes. Here Muruga tested
      the Tamil saint Avvaiyar with a fruit, revealing his playful wisdom. It is a serene forest shrine, far from
      the bustle of the other temples.
    chips:
    - {text: 🧠 Wisdom, style: event}
    - Forest
    - Avvaiyar
    journey: {label: Pazhamudircholai, sub: Forest}
    map: {lat: 10.08, lng: 78.22, popup: Forest abode · near Madurai}
