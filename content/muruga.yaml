  - {value: renunciation, label: 🧘 Renunciation, color: muruga}
  - {value: wisdom, label: 🧠 Wisdom, color: muruga}
  - {value: union, label: 💞 Union, color: muruga}
  footer: [🦚 A visual map of the Arupadai Veedu · The six abodes are sung in the Sangam poem <em>Thirumurugatruppadai</em>
      by Nakkirar, Map data © OpenStreetMap contributors · Coordinates are approximate]
blocks:
