  layout: page
  title: Arupadai Veedu — The Six Abodes of Lord Muruga
  description: 'Lord Muruga''s six abodes from Nakkirar''s Thirumurugatruppadai: Thiruparankundram, Thiruchendur, Palani, Swamimalai, Thiruthani and Pazhamudircholai.'
  favicon: 🦚
  search: Search abodes, legends, cities…
  native: ta
  palette:
    muruga: ['#f7b731', '#c98a00']
    muruga-2: ['#fc5c65', '#d63c46']
  gradient: [muruga, muruga-2]
  primary: muruga
  h1: Arupadai Veedu
  intro: The six sacred abodes of Lord Muruga, sung in the ancient Tamil Sangam poem <em>Thirumurugatruppadai</em>
    by Nakkirar. Each temple marks a chapter in Muruga's divine life — from his marriage to his victory over evil,
    from his wisdom to his renunciation.
  legend:
  - {label: Six Abodes of Muruga, color: muruga}
