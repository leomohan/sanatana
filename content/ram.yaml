  title: When India Says “Ram” — Twelve Everyday Expressions
  description: The name Ram in everyday Indian speech, from Ram Ram to Ram Naam Satya Hai. Twelve expressions and
    what each one says about the person speaking.
  favicon: 🙏
  search: Search expressions — Ram Bharose, Rambaan…
  native: hi
  palette:
    inner: ['#dc9163', '#bd6734']
    moral: ['#e0826a', '#a34f37']
    faith: ['#9aa87a', '#66805b']
    society: ['#8eafc1', '#587487']
    gold: ['#e5ad43', '#c8860a']
  gradient: [inner, moral, faith, society]
  primary: gold
  h1: When India Says “Ram”
  intro: 'One familiar name runs through twelve everyday expressions. They carry greeting, grief, instinct, conscience,
    moral shock, uncertainty, faith, justice, precision, governance, resilience and mortality. People say them without
    thinking, and each one holds a whole attitude to life.'
  legend:
  - {label: The inner human, color: inner}
  - {label: The moral human, color: moral}
  - {label: Faith and action, color: faith}
  - {label: Society and existence, color: society}
