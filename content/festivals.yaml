page:
  file: festivals.html
  layout: page
  title: The Festival Wheel — Hindu Festivals Through the Lunar Year
  description: 'A year-round wheel of Hindu festivals set on the Panchanga: twelve lunar months, bright and dark halves and six seasons, each festival placed on its tithi.'
  favicon: 🎆
  search: Search festivals, months, regions…
  native: sa
  palette:
    vasanta: ['#26de81', '#1e9e5c']
    grishma: ['#ff9f43', '#d9771a']
    varsha: ['#4a9eff', '#1a6fc4']
    sharad: ['#a55eea', '#7b3fc4']
    hemanta: ['#2bcbba', '#1a9488']
    shishira: ['#ff6b81', '#d63c5a']
    gold: ['#f7b731', '#b7861b']
  gradient: [vasanta, grishma, varsha, sharad, hemanta, shishira]
  primary: gold
  h1: The Festival Wheel
  intro: 'Hindu festivals are fixed by the Moon, not the Gregorian calendar, so they move from year to year. Tied to
    the <a href="jyotisha.html">Panchanga</a>, they keep their place in the lunar year. The wheel below lays out that
    year: twelve months, each with a bright half and a dark half, six seasons, and each festival on its tithi.'
  legend:
  - {label: Vasanta · spring, color: vasanta}
  - {label: Grishma · summer, color: grishma}
  - {label: Varsha · rains, color: varsha}
  - {label: Sharad · autumn, color: sharad}
  - {label: Hemanta · early winter, color: hemanta}
  - {label: Shishira · late winter, color: shishira}
  filters:
  - {value: all, label: Whole year, color: gold}
  - {value: vasanta, label: Vasanta, color: vasanta}
  - {value: grishma, label: Grishma, color: grishma}
