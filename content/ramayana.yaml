  gradient: [bala, aranya, rama, yuddha]
  primary: rama
  h1: The Ramayana Journey
  intro: Rama's route from Ayodhya to Lanka and home again — thirteen stops placed where tradition places them, each
    with a note on how three great poets tell what happened there. Valmiki composed in Sanskrit, Kamban in Tamil, and
    Tulsidas in Awadhi; the same journey reads differently in each.
