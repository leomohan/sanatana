- type: callout
  text: '🎶 Arunachala Kavi''s Tamil <em>Rama Natakam</em> (18th century) follows Kamban closely and is still sung in
    concerts. See the <a href="carnatic.html">Carnatic music page</a>. Rama is also the seventh of the <a href="dashavatara.html">ten
    avatars</a>.'
