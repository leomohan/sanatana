blocks:
- type: pairs
  title: Three poets, one road
  intro: Each poet follows the same route but stops at different places. Their differences are the subject of this map.
  items:
  - title: Valmiki · Sanskrit
    color: valmiki
    text: The <em>Adi Kavya</em>, the first poem. About 24,000 verses in seven Kandas. Rama is an ideal man whose divinity
      the poem mostly leaves in the background. Scholars treat the Bala and Uttara Kandas as later layers.
  - title: Kamban · Tamil
    color: kamba
    text: The <em>Iramavataram</em>, usually dated to the 12th century. Over ten thousand verses in six Kandams, ending
      with the coronation. It is set in a Tamil landscape and is rich in emotion and drama. Rama is plainly God come
      down.
  - title: Tulsidas · Awadhi
    color: tulsi
    text: The <em>Ramcharitmanas</em>, begun in Ayodhya in 1574. Seven Kands, told as Shiva tells it to Parvati. A work
      of bhakti from beginning to end; it is sung across North India and staged in every Ramlila.
- {type: filters}
- {type: map, route: true, label: Map of Rama's journey}
- type: callout
  text: '🧭 The dashed line follows Rama''s own route. Stop 10, Ashoka Vatika, is off the line: Hanuman went there
    alone and Rama never did. Most places on this map are traditional identifications. The epics name rivers, forests
    and hills, but not modern towns.'
- {type: journey}
- type: cards
  cards:
  - id: ayodhya
    anchor: true
    num: '1'
    title: Ayodhya
    native: अयोध्या
    subtitle: Bala Kanda · The city of Kosala
    accent: bala
    tags: bala
    body: The capital of Kosala, on the Sarayu. After a sacrifice for sons, King Dasharatha's three queens bear four
      princes. Kausalya bears Rama, Kaikeyi bears Bharata, and Sumitra bears the twins Lakshmana and Shatrughna. The
      sage Vishwamitra arrives and asks for young Rama to protect his sacrifice, and the journey begins.
    facts:
    - [Valmiki, Opens with Narada telling Valmiki of a perfect man. Grief at a hunter killing a bird turns into the first
        shloka.]
    - [Kamban, 'Opens slowly, with a river, a country and a city: long padalams describing the Sarayu, Kosala and Ayodhya.']
    - [Tulsidas, The whole story sits inside a series of dialogues. Shiva tells it to Parvati; other tellers pass it on.]
    chips: [Departure, Dasharatha's four sons]
    journey: {label: Ayodhya, sub: Start}
    map: {lat: 26.7922, lng: 82.1998, popup: 'Bala Kanda · Ayodhya, Uttar Pradesh', name: 1 · Ayodhya}
  - id: siddhashrama
    anchor: true
    num: '2'
    title: Siddhashrama & the Tataka forest
    native: सिद्धाश्रम
    subtitle: Bala Kanda · Vishwamitra's hermitage
    accent: bala
    tags: bala
    body: Vishwamitra leads the brothers east across the Ganga. On the way he teaches them the <em>Bala</em> and
      <em>Atibala</em> mantras against hunger and fatigue. Rama kills the demoness Tataka and receives celestial weapons.
      At Siddhashrama he guards the sage's sacrifice, driving off Maricha and killing Subahu. Maricha survives to return
      in the forest years.
    facts:
    - [Today, 'Buxar, Bihar — traditionally identified with Siddhashrama and the Tataka forest']
    chips: [Tataka, First weapons, Maricha]
    journey: {label: Siddhashrama, sub: Buxar}
    map: {lat: 25.5647, lng: 83.9777, popup: 'Bala Kanda · Buxar, Bihar (traditional)', name: 2 · Siddhashrama}
  - id: ahalya
    anchor: true
    num: '3'
    title: Ahalya's hermitage
    native: अहल्या
    subtitle: Bala Kanda · Gautama's empty ashram
    accent: bala
    tags: bala
    body: On the road to Mithila, Vishwamitra shows the brothers a deserted hermitage. Indra, disguised as the sage
      Gautama, had come to Gautama's wife Ahalya, and Gautama cursed them both. The three poets differ most clearly here.
    facts:
    - [Valmiki, 'She is <strong>not</strong> turned to stone. She lives unseen in the hermitage, fasting on air, until
        Rama arrives. She recognises Indra but consents. Rama touches her feet in respect.']
    - [Kamban, 'The curse turns her to stone. The dust of Rama''s feet restores her. Vishwamitra remarks that he has seen
        the power of Rama''s hand (against Tataka) and now the power of his feet.']
    - [Tulsidas, 'She has become stone. The touch of Rama''s feet frees her, and she sings his praise. The stone form
        reaches Tulsidas through texts such as the Adhyatma Ramayana.']
    - [Today, 'Ahalya Sthan, Darbhanga district, Bihar (traditional)']
    chips: [Ahalya, Gautama, Three tellings]
    journey: {label: Ahalya, sub: Darbhanga}
    map: {lat: 26.3125, lng: 85.8145, popup: 'Bala Kanda · Ahalya Sthan, Bihar (traditional)', name: 3 · Ahalya's hermitage}
  - id: mithila
    anchor: true
    num: '4'
    title: Mithila
    native: मिथिला
    subtitle: Bala Kanda · The bow and the wedding
    accent: bala
    tags: bala
    body: King Janaka keeps Shiva's great bow. He has promised Sita, the daughter he found in a ploughed furrow, to whoever
      can string it. Rama lifts the bow and it breaks as he draws it. Four weddings follow. Rama marries Sita, Lakshmana
      marries Urmila, Bharata marries Mandavi and Shatrughna marries Shrutakirti. Parashurama then challenges Rama.
    facts:
    - [Valmiki, 'Rama and Sita do not meet before the bow. Parashurama confronts Rama on the road home to Ayodhya.']
    - [Kamban, 'They glimpse each other from a palace balcony and a street in Mithila, and fall in love before the bow
        is broken. This is the famous moment in which "he looked, and she looked".']
    - [Tulsidas, 'They first see each other in Janaka''s flower garden (the Pushpavatika). Parashurama storms into the
        court as soon as the bow breaks.']
    - [Today, 'Janakpur, Nepal — traditionally Janaka''s capital']
    chips: [Shiva's bow, Sita, Parashurama]
    journey: {label: Mithila, sub: Janakpur}
    map: {lat: 26.7288, lng: 85.9263, popup: 'Bala Kanda · Janakpur, Nepal', name: 4 · Mithila (Janakpur)}
  - id: shringaverapura
    anchor: true
    num: '5'
    title: Shringaverapura
    native: शृङ्गवेरपुर
    subtitle: Ayodhya Kanda · Exile and the Ganga crossing
    accent: ayodhya
    tags: ayodhya
    body: On the eve of Rama's coronation, Kaikeyi claims two old boons from Dasharatha. Bharata is to be king and Rama
      is to spend fourteen years in the forest. Rama, Sita and Lakshmana leave at once. At Shringaverapura the Nishada
      chief Guha receives them and they cross the Ganga. In Kamban, Rama embraces Guha as a brother. In Tulsidas, the
      boatman (<em>kevat</em>) insists on washing Rama's feet first. He fears that the dust which turned a stone into
      a woman might do the same to his boat.
    facts:
    - [Why exile — Valmiki, Manthara is alarmed by Rama's coronation and works on Kaikeyi until she gives way.]
    - [Why exile — Kamban, 'Manthara nurses an old grudge: as a boy, Rama hit her hump with a pellet from his toy bow.']
    - [Why exile — Tulsidas, 'The gods ask the goddess Saraswati to turn Manthara''s mind, so that the exile serves the
        divine plan.']
    - [Today, 'Shringverpur, near Prayagraj, Uttar Pradesh']
    chips: [Kaikeyi's boons, Guha, Kevat]
    journey: {label: Shringaverapura, sub: Ganga}
    map: {lat: 25.5873, lng: 81.6418, popup: 'Ayodhya Kanda · Shringverpur, near Prayagraj', name: 5 · Shringaverapura}
  - id: chitrakoot
    anchor: true
    num: '6'
    title: Chitrakoot
    native: चित्रकूट
    subtitle: Ayodhya Kanda · Bharata's visit
    accent: ayodhya
    tags: ayodhya
    body: The exiles pass the hermitage of Bharadvaja at Prayag and settle on Chitrakoot hill. In Ayodhya, Dasharatha
      dies of grief. Bharata refuses the throne and comes to bring Rama back. Rama holds to his father's word. Bharata
      takes Rama's sandals (<em>padukas</em>), places them on the throne and rules as regent from Nandigram, outside
      Ayodhya.
    facts:
    - [All three, The padukas are among the best-loved images in every telling. Bharata's devotion is the counterweight
        to Kaikeyi's demand.]
    - [Today, 'Chitrakoot, on the Uttar Pradesh–Madhya Pradesh border']
    chips: [Bharata, Padukas, Dasharatha's death]
    journey: {label: Chitrakoot, sub: Bharata}
    map: {lat: 25.1747, lng: 80.8644, popup: 'Ayodhya Kanda · Chitrakoot', name: 6 · Chitrakoot}
  - id: panchavati
    anchor: true
    num: '7'
    title: Panchavati
    native: पञ्चवटी
    subtitle: Aranya Kanda · The golden deer
    accent: aranya
    tags: aranya
    body: After years in the Dandaka forest and a visit to the sage Agastya, the three settle at Panchavati on the Godavari.
      Lakshmana mutilates Shurpanakha, Ravana's sister, and Rama destroys the army of Khara and Dushana. Ravana then sends
      Maricha as a golden deer. While Rama chases it, Ravana carries Sita off. The old vulture Jatayu fights him and
      falls.
    facts:
    - [The line — Valmiki, 'There is no Lakshmana rekha. Lakshmana leaves only after Sita''s bitter accusations.']
    - [The line — Tulsidas, 'Not in his forest book either. Mandodari later taunts Ravana that he could not cross a line
        drawn by Lakshmana (Lanka Kand). The full scene belongs to later retellings.']
    - [The abduction — Valmiki, Ravana seizes Sita by her hair and thighs and lifts her into his chariot.]
    - [The abduction — Kamban, 'A curse forbids Ravana to touch a woman against her will, so he uproots the ground she
        stands on and carries it away.']
    - [The abduction — Tulsidas, Rama had already placed the real Sita in the keeping of Agni. Ravana takes only her
        shadow (the Maya Sita).]
    - [Today, 'Panchavati, Nashik, Maharashtra']
    chips: [Shurpanakha, Golden deer, Jatayu]
    journey: {label: Panchavati, sub: Nashik}
    map: {lat: 20.0076, lng: 73.7929, popup: 'Aranya Kanda · Panchavati, Nashik', name: 7 · Panchavati}
  - id: pampa
    anchor: true
    num: '8'
    title: Pampa & Shabari
    native: शबरी
    subtitle: Aranya Kanda · The ascetic who waited
    accent: aranya
    tags: aranya
    body: Searching south, the brothers free the headless demon Kabandha, who sends them to Lake Pampa. There Shabari,
      the aged disciple of the sage Matanga, has waited years for Rama. She honours him and leaves her body.
    facts:
    - [Valmiki, She offers forest food gathered on the banks of the Pampa and rises to the heavens.]
    - [Kamban, 'A short episode: she is released from rebirth after seeing Rama.']
    - [Tulsidas, Rama teaches her the nine forms of devotion (<em>navadha bhakti</em>). It is one of the poem's best-loved
        passages.]
    - [The tasted berries, 'In none of the three. The scene of Shabari tasting each berry first comes from later devotional
        and folk retellings.']
    - [Today, 'Pampa Sarovar, near Hampi, Karnataka (traditional)']
    chips: [Kabandha, Matanga, Navadha bhakti]
    journey: {label: Pampa, sub: Shabari}
    map: {lat: 15.3561, lng: 76.4847, popup: 'Aranya Kanda · Pampa Sarovar, near Hampi', name: 8 · Pampa (Shabari)}
  - id: kishkindha
    anchor: true
    num: '9'
    title: Kishkindha
    native: किष्किन्धा
    subtitle: Kishkindha Kanda · Hanuman, Sugriva and Vali
    accent: kishkindha
    tags: kishkindha
    body: At Rishyamuka hill Hanuman meets the brothers and brings them to the exiled monkey prince Sugriva. Rama and
      Sugriva make a pact. Rama shoots Sugriva's brother Vali while the two brothers fight, and Sugriva is crowned. After
      the monsoon, search parties go out in every direction. In the south, the vulture Sampati, Jatayu's brother, sees
      Sita across the sea in Lanka.
    facts:
    - [Valmiki, 'Vali, struck from cover, rebukes Rama. Rama answers that Vali took his brother''s wife and that Rama
        acts with the authority of the Ikshvaku kings.']
    - [Kamban, 'Vali''s reproach is one of the poem''s great speeches. Dying, he sees who Rama is and entrusts his son
        Angada to him.']
    - [Tulsidas, Vali questions Rama and accepts his answer. He dies at Rama's feet and gains liberation.]
    - [Today, 'Anegundi and Hampi, Karnataka — Anjanadri hill is revered as Hanuman''s birthplace']
    chips: [Hanuman, Sugriva, Vali, Sampati]
    journey: {label: Kishkindha, sub: Hampi}
    map: {lat: 15.3418, lng: 76.4612, popup: 'Kishkindha Kanda · Anegundi–Hampi (traditional)', name: 9 · Kishkindha}
  - id: ashoka-vatika
    anchor: true
    num: '10'
    title: Ashoka Vatika, Lanka
    native: अशोकवाटिका
    subtitle: Sundara Kanda · Hanuman finds Sita
    accent: sundara
    tags: sundara
    body: Hanuman leaps the ocean and searches Ravana's city by night. He finds Sita in a grove of ashoka trees, guarded
      by rakshasis and refusing Ravana. He gives her Rama's ring and takes her hair jewel back as a sign. Then he lets
      himself be captured, speaks to Ravana and sets Lanka on fire with his burning tail.
    facts:
    - [Valmiki, 'Searching the palace, Hanuman sees Mandodari asleep and for a moment takes her for Sita. He then rejects
        the thought.']
    - [Kamban, 'Back with Rama, Hanuman''s first word is "I have seen" (<em>kaṇḍēn</em>). He says it first so that Rama''s
        heart will not sink while he waits for news.']
    - [Tulsidas, 'Hanuman meets Vibhishana in Lanka; his house is marked by Rama''s name and a tulasi plant.']
    - [Today, 'Seetha Amman Temple, Sita Eliya, near Nuwara Eliya, Sri Lanka. The identification is a modern tradition.']
    chips: [Rama's ring, Chudamani, Lanka burns]
    journey: {label: Ashoka Vatika, sub: Hanuman}
    map: {lat: 6.9332, lng: 80.8105, popup: 'Sundara Kanda · Sita Eliya, Sri Lanka (tradition)', name: 10 · Ashoka Vatika,
      route: false}
  - id: rameswaram
    anchor: true
    num: '11'
    title: Rameswaram & the Setu
    native: रामेश्वरम्
    subtitle: Yuddha Kanda · Vibhishana and the bridge
    accent: yuddha
    tags: yuddha
    body: The army reaches the shore. Vibhishana, Ravana's brother, has warned Ravana to return Sita and been driven
      out. He crosses over and asks Rama for refuge. The ocean yields, and the monkey Nala leads the building of the
      bridge to Lanka.
    facts:
    - [Valmiki, 'Rama''s vow of refuge: to anyone who comes even once and says "I am yours", he gives safety from all
        beings.']
    - [Kamban, 'Rama tells Vibhishana that with Guha they became five brothers, with Sugriva six, and with him seven.']
    - [Tulsidas, Before the bridge is built Rama installs and worships a Shiva lingam. Valmiki only has Rama point out
        the place on the flight home.]
    - [Today, 'Ramanathaswamy Temple, Rameswaram, and Dhanushkodi, Tamil Nadu']
    chips: [Vibhishana, Nala, Rama Setu]
    journey: {label: Rameswaram, sub: Setu}
    map: {lat: 9.2881, lng: 79.3174, popup: 'Yuddha Kanda · Rameswaram, Tamil Nadu', name: 11 · Rameswaram}
  - id: lanka
    anchor: true
    num: '12'
    title: The war in Lanka
    native: लङ्का
    subtitle: Yuddha Kanda · Ravana falls
    accent: yuddha
    tags: yuddha
    body: The siege brings the great duels. Kumbhakarna wakes to fight and falls. Indrajit binds the brothers with
      serpent-arrows. When Lakshmana falls to a mighty weapon, Hanuman carries back a whole mountain of herbs to revive
      him.
      At last Rama kills Ravana. Then comes Sita's ordeal by fire.
    facts:
    - [The fire — Valmiki, 'Rama speaks harshly to Sita in front of the army. She enters the fire, and Agni gives her
        back unharmed.']
    - [The fire — Kamban, 'Sita enters the fire in the same way, and the fire god himself returns her and declares her
        purity.']
    - [The fire — Tulsidas, 'Only the shadow Sita enters the fire. The real Sita, kept safe by Agni since Panchavati,
        returns.']
    - [Today, 'Divurumpola, near Welimada, Sri Lanka, is the traditional site of the fire ordeal']
    chips: [Kumbhakarna, Indrajit, Sanjivani, Agni pariksha]
    journey: {label: Lanka, sub: The war}
    map: {lat: 6.9208, lng: 80.8822, popup: 'Yuddha Kanda · Divurumpola, Sri Lanka (tradition)', name: 12 · Lanka}
  - id: return
    anchor: true
    num: '13'
    title: Nandigram & the coronation
    native: नन्दिग्राम
    subtitle: Yuddha Kanda · Home by the Pushpaka
    accent: yuddha
    tags: yuddha
    body: Rama flies home in the aerial car Pushpaka, pointing out each place to Sita on the way. Hanuman goes ahead
      to Bharata at Nandigram, where Bharata had kept the sandals on the throne for fourteen years. The brothers meet,
      and Rama is crowned in Ayodhya.
    facts:
    - [Valmiki, The Yuddha Kanda ends with the coronation. The Uttara Kanda adds Sita's banishment and her return to the
        earth; scholars widely see it as a later layer.]
    - [Kamban, 'Ends with the coronation. A Tamil Uttara Kandam is attributed to Ottakoothar, not Kamban.']
    - [Tulsidas, 'The Uttar Kand describes Rama''s reign (Ram Rajya) and the crow-sage Kakabhushundi''s teaching. It does
        not tell of Sita''s exile.']
    - [Today, 'Nandigram (Bharat Kund), south of Ayodhya']
    chips: [Pushpaka, Bharata, Pattabhishekam]
    journey: {label: Nandigram, sub: Home}
    map: {lat: 26.6699, lng: 82.1496, popup: 'Yuddha Kanda · Nandigram, near Ayodhya', name: 13 · Nandigram}
  empty: Nothing matches your search. Try another word or clear the filter.
