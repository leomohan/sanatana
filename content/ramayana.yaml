  file: ramayana.html
  layout: page
  title: The Ramayana Journey — Rama's Route in Valmiki, Kamban and Tulsidas
  description: Interactive map of Rama's route from Ayodhya to Lanka and back, with notes on how Valmiki, Kamban and
    Tulsidas tell the key episodes.
  favicon: 🏹
  search: Search places, episodes, poets…
  native: sa
  palette:
    rama: ['#4a9eff', '#1a6fc4']
    bala: ['#ff9f43', '#d9771a']
    ayodhya: ['#f7b731', '#b7861b']
    aranya: ['#26de81', '#1e9e5c']
