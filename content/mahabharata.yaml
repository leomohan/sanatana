- type: cards
  title: The people who drove the story
  grid: v3
  cards:
  - title: Bhishma
    native: भीष्म
    subtitle: The grandsire
    accent: kuru
    tags: kuru
    body: Born Devavrata, the eighth son of Ganga. He gave up the throne and marriage so that his father could marry Satyavati.
      For that terrible vow (<em>bhishma</em>) he got his name, and the boon of choosing the hour of his death. He fell
      on the tenth day of the war. From his bed of arrows he taught Yudhishthira the long lessons of the Shanti and Anushasana
      Parvas.
    chips: [Vow of celibacy, Bed of arrows, Vishnu Sahasranama]
  - title: Satyavati & Vyasa
    native: सत्यवती · व्यास
    subtitle: Mother and son
    accent: kuru
    tags: kuru
    body: Satyavati, a fisher chief's daughter, bore Vyasa to the sage Parashara on an island in the Yamuna; hence his
      name Dvaipayana. When her sons by Shantanu died without heirs, she called Vyasa to father children with the widows.
      Vyasa is also the epic's author. Tradition says Ganesha wrote it down as he dictated.
    chips: [Niyoga, Author of the epic]
  - title: Dhritarashtra & Gandhari
    native: धृतराष्ट्र · गान्धारी
    subtitle: The blind king and his queen
    accent: kaurava
    tags: kaurava
    body: Dhritarashtra, born blind, was passed over for his brother Pandu. When Pandu died he ruled. Gandhari of Gandhara
      bound her own eyes for life to share her husband's darkness. Her hundred sons and a daughter came from a mass of
      flesh that Vyasa divided into pots.
    chips: [A hundred sons, Blindfold, Sanjaya's narration]
  - title: Duryodhana
    native: दुर्योधन
    subtitle: Eldest of the Kauravas
    accent: kaurava
    tags: kaurava
    body: Duryodhana believed the throne was his by right. He feared Bhima's strength and resented the Pandavas' rise.
      He made Karna a king and his closest friend. With Shakuni's loaded dice he won everything from Yudhishthira. Bhima
      broke his thigh with a mace on the eighteenth day.
    chips: [The dice game, Friend of Karna]
  - title: Pandu, Kunti & Madri
    native: पाण्डु · कुन्ती · माद्री
    subtitle: Parents of the Pandavas
    accent: pandava
    tags: pandava yadava
    body: A sage whom Pandu shot while the sage was in a deer's form cursed him to die if he lay with a wife. Kunti
      held a mantra from the sage Durvasa that could summon any god. Through it she bore Yudhishthira by Dharma, Bhima
      by Vayu and Arjuna by Indra. She shared the mantra with Madri, who bore the twins by the Ashvins.
    chips: [Durvasa's mantra, Five sons]
  - title: The five Pandavas
    native: पञ्च पाण्डव
    subtitle: Sons of Pandu
    accent: pandava
    tags: pandava
    body: 'Raised in the forest and brought to Hastinapura as boys, the five shared everything, including their wife.
      They lost their kingdom at dice and spent twelve years in the forest and a thirteenth in disguise. Then they won
      the war at Kurukshetra.'
    facts:
    - [Yudhishthira, 'Kunti, by Dharma · the just king · answers the Yaksha''s questions']
    - [Bhima, 'Kunti, by Vayu · the strong one · kills Duhshasana and Duryodhana']
    - [Arjuna, 'Kunti, by Indra · the archer · hears the <a href="gita.html">Bhagavad Gita</a>']
    - [Nakula & Sahadeva, 'Madri, by the Ashvins · the twins · Sahadeva kills Shakuni']
  - title: Karna
    native: कर्ण
    subtitle: The first-born no one knew
    accent: pandava
    tags: pandava kaurava
    body: Kunti's son by the Sun, born before her marriage and set adrift in a basket. A charioteer's family raised him.
      Mocked for his birth, he found a friend in Duryodhana and never broke with him. He gave away his divine armour and
      earrings to Indra, who came disguised as a brahmin. Arjuna killed him on the seventeenth day.
    chips: [Kavacha & kundala, King of Anga, Generosity]
  - title: Draupadi
    native: द्रौपदी
    subtitle: Born of fire
    accent: panchala
    tags: panchala pandava
    body: Draupadi rose with her brother Dhrishtadyumna from Drupada's sacrificial fire. Arjuna won her by hitting the
      target at her swayamvara, and Kunti's word made her wife to all five brothers. Dragged into the dice hall, she
      asked whether a man who had lost himself could still stake her. Her garment was miraculously replenished; later
      tellings credit Krishna.
    chips: [Swayamvara, The dice hall, Panchakanya]
  - title: Krishna
    native: कृष्ण
    subtitle: Cousin, counsellor, charioteer
    accent: yadava
    tags: yadava
    body: Krishna was the son of Vasudeva, Kunti's brother, which made him the Pandavas' cousin. Arjuna was also his
      friend and Subhadra's husband. He went as the Pandavas' envoy to Hastinapura and would not bear arms in the war.
      As Arjuna's charioteer he spoke the <a href="gita.html">Bhagavad Gita</a>. He is the eighth <a href="dashavatara.html">avatar</a>
      in most lists.
    chips: [Envoy of peace, Charioteer, The Gita]
  - title: Abhimanyu & Parikshit
    native: अभिमन्यु · परीक्षित्
    subtitle: The line that survived
    accent: pandava
    tags: pandava yadava
    body: Abhimanyu, Arjuna's son by Subhadra, broke into Drona's wheel formation on the thirteenth day and was killed
      inside it. In the popular telling he had learned to enter it while still in the womb. His son Parikshit was struck
      in the womb by Ashwatthama's weapon, and Krishna revived him. Parikshit became the Pandavas' only heir.
    chips: [Chakravyuha, The surviving heir]
  - title: Vidura
    native: विदुर
    subtitle: The voice of dharma
    accent: kuru
    tags: kuru
    body: Vidura was the third son by Vyasa, born to a maid. A curse had made Dharma himself take birth as him. As Dhritarashtra's
      minister he warned against the dice game, and he saved the Pandavas from the house of lac. His counsel to the king
      is known as the <em>Vidura Niti</em>.
    chips: [House of lac, Vidura Niti]
  - title: Drona & Ashwatthama
    native: द्रोण · अश्वत्थामा
    subtitle: Teacher and son
    accent: other
    tags: kaurava
    body: Drona, born from a vessel (<em>drona</em>) of the sage Bharadvaja, taught arms to all the Kuru princes. Arjuna
      was his favourite, and he demanded Ekalavya's thumb. He fought for the Kauravas. When told falsely that Ashwatthama
      was dead, he laid down his weapons, and Dhrishtadyumna killed him. In revenge Ashwatthama slaughtered the sleeping
      Pandava camp, including the five sons of Draupadi.
    chips: [Ekalavya, '"Ashwatthama is dead"', The night raid]
