- type: callout
  text: '🌙 <strong>Before Shantanu.</strong> The Kurus are of the Lunar line. Pururavas → Nahusha → Yayati → Puru → … →
    Dushyanta and Shakuntala → Bharata, after whom the land is named → … → Hastin, founder of Hastinapura → … → Samvarana
    and Tapati → Kuru → … → Pratipa → Shantanu. Yayati''s son Yadu starts the Yadava line into which Krishna is born.'
- {type: filters}
