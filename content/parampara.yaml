- type: callout
  text: '🕉️ <strong>Before the first Jagadguru.</strong> Sringeri counts its succession through three earlier lineages.
    The divine one runs from Sadashiva to Narayana to Brahma. The sages follow: Vasishtha, Shakti, Parashara, Vyasa and
    Shuka. Then come the teachers Gaudapada and Govinda Bhagavatpada, Shankara''s own guru.'
