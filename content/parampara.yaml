  intro: 'A tradition survives only as long as someone teaches it to someone else. Each line below is a
    <em>parampara</em>, a chain of teachers that its followers count unbroken from its founder to the present. The
    three lines shown are Shankara''s Sringeri seat, the Sri Vaishnava teachers around Ramanuja, and Madhva''s pontiffs.'
