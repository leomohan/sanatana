- type: callout
  text: '📜 <strong>Sri Vaishnava line, as told in the Tenkalai account:</strong> Nammalvar → Nathamuni → Uyyakkondar →
    Manakkal Nambi → Alavandar (Yamunacharya) → Periya Nambi → <strong>Ramanuja</strong> → Embar → Parasara Bhattar →
    Nanjeeyar → Nampillai → Vadakku Thiruveedhi Pillai → Pillai Lokacharya → Thiruvaimozhi Pillai → Manavala Mamunigal.
    The Vadakalai line runs from Ramanuja through Kidambi Achan and his descendants to Kidambi Appullar, the teacher of
    <strong>Vedanta Desika</strong>.'
