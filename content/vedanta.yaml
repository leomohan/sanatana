- type: compare
  title: ⚖️ Side-by-Side Comparison
  color: vishishtadvaita
  intro: Scroll horizontally to see all three columns. The filter chips above can narrow the table to a single school.
  corner: Criterion
  columns:
  - {key: advaita, label: Advaita, color: advaita}
