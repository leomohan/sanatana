  - {value: dvaita, label: Dvaita, color: dvaita}
  footer: ['🪷 A comparison map of the three great Vedanta schools · All three accept the Upanishads, Brahma Sutra,
      and Bhagavad Gita as authoritative', Dates are approximate. Each school has developed rich sub-traditions
      and internal debates.]
  large_cards: true
