  primary: vishishtadvaita
  h1: The Three Vedantas
  intro: 'Three great commentators on the Upanishads, three radically different visions of reality. All accept the
    same scriptures — yet they disagree on the most fundamental question: are we one with God, part of God, or eternally
    distinct from God?'
  legend:
  - {label: Advaita (Non-dual), color: advaita}
  - {label: Vishishtadvaita (Qualified Non-dual), color: vishishtadvaita}
  - {label: Dvaita (Dual), color: dvaita}
