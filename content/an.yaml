  h1: Azhwars & Nayanmars
  intro: Two parallel streams of Tamil Bhakti — the Vaishnava Azhwars immersed in love of Vishnu, and the Saiva
    Nayanmars devoted to Shiva. Together they shaped the devotional landscape of South India from the 6th to 9th
    centuries CE.
