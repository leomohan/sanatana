    - [Deity, Korravai]
- type: cards
  title: The Eight Anthologies · Ettuthokai
  intro: Collections of short and medium poems by hundreds of poets, gathered and arranged by later editors. Counts are
    the poems that survive.
  grid: v4
  cards:
  - {title: Natrinai, native: நற்றிணை, subtitle: 400 poems · 9–12 lines, accent: akam, tags: akam, body: '"The good tinai."
      Love poems across all five landscapes.'}
  - {title: Kurunthokai, native: குறுந்தொகை, subtitle: About 400 poems · 4–8 lines, accent: akam, tags: akam, body: The
      short collection. Its compressed love lyrics are among the most translated Tamil poems.}
  - {title: Ainkurunuru, native: ஐங்குறுநூறு, subtitle: About 500 poems · 3–6 lines, accent: akam, tags: akam, body: 'Five
      poets, one landscape each, with a hundred very short poems apiece.'}
  - {title: Kalithokai, native: கலித்தொகை, subtitle: 150 poems, accent: akam, tags: akam, body: Love poems in the
      dramatic kali metre, often set as dialogues.}
  - {title: Akananuru, native: அகநானூறு, subtitle: About 400 poems · 13–31 lines, accent: akam, tags: akam, body: '"The
      four hundred on the inner world." The longest akam poems.'}
  - {title: Purananuru, native: புறநானூறு, subtitle: About 400 poems, accent: puram, tags: puram, body: 'Kings, battles,
      generosity, death and ethics. It holds the line "Every town is our town, everyone our kin."'}
  - {title: Pathitrupathu, native: பதிற்றுப்பத்து, subtitle: 10 decades · 8 survive, accent: puram, tags: puram, body: Ten
      poems each in praise of ten Chera kings. The first and last decades are lost.}
  - {title: Paripadal, native: பரிபாடல், subtitle: 70 composed · 24 survive whole, accent: puram, tags: puram akam, body: 'Songs to Thirumal and Murugan and on the river
      Vaigai. Hymns and love poetry meet here, early signs of later bhakti.'}
- type: table
  section: puram
  title: The Ten Idylls · Pattuppattu
  intro: Ten long poems, from about a hundred to almost eight hundred lines. Five are "guide poems" (<em>arruppadai</em>),
    in which one bard directs another to a generous patron.
  color: puram
  columns: [Idyll, Poet, Lines, Kind]
  rows:
  - ['Thirumurugarruppadai · திருமுருகாற்றுப்படை', Nakkirar, '317', 'Guide poem to <a href="muruga.html">Murugan''s six abodes</a>']
  - ['Porunararruppadai · பொருநராற்றுப்படை', Mudathama Kanniyar, '234', Guide poem · puram]
  - ['Sirupanarruppadai · சிறுபாணாற்றுப்படை', Nattattanar, '296', Guide poem · puram]
  - ['Perumpanarruppadai · பெரும்பாணாற்றுப்படை', Uruthirankannanar, '500', Guide poem · puram]
  - ['Malaipadukadam · மலைபடுகடாம்', Perunkausikanar, '583', Guide poem · puram]
  - ['Mullaippattu · முல்லைப்பாட்டு', Napputhanar, '103', Akam · waiting]
  - ['Maduraikkanchi · மதுரைக்காஞ்சி', Mangudi Marudanar, '782', Puram · Madurai and impermanence]
  - ['Nedunalvadai · நெடுநல்வாடை', Nakkirar, '188', 'Puram · the long north wind']
  - ['Kurinjippattu · குறிஞ்சிப்பாட்டு', Kapilar, '261', Akam · union in the hills]
  - ['Pattinappalai · பட்டினப்பாலை', Uruthirankannanar, '301', Akam · the port of Puhar]
- type: cards
  title: Thirukkural
  section: ethics
  grid: two
  cards:
  - title: Thirukkural
    native: திருக்குறள்
    subtitle: Thiruvalluvar · probably the early centuries CE
    accent: ethics
    tags: ethics
    corner_icon: ⚖️
    body: 'The best-known of the eighteen shorter works, and the most translated work in Tamil. It has 1,330 couplets
      in 133 chapters of ten. Each couplet, a <em>kural</em>, is just seven metrical feet long. It speaks to no sect and
      names no king, which is one reason every age has claimed it.'
    facts:
    - [Aram · virtue, 38 chapters]
    - [Porul · wealth and statecraft, 70 chapters]
    - [Inbam · love, 25 chapters]
    - [First couplet, '"As A begins all letters, so God is first of the world" (அகர முதல எழுத்தெல்லாம் ஆதி பகவன் முதற்றே உலகு)']
- type: table
  title: The Eighteen Shorter Works · Pathinenkilkanakku
  intro: Short poems in the venpa metre, mostly c. 100–500 CE. Eleven teach ethics, six are love poetry and one is about
    war. Naladiyar is the only one by many poets; each of the others has a single author.
  color: ethics
  columns: [Work, Kind]
  rows:
  - [Naladiyar, 'Ethics · 400 quatrains by many poets']
  - [Nanmanikkadigai, Ethics]
  - [Inna Narpathu, 'Ethics · forty things that bring sorrow']
  - [Iniyavai Narpathu, 'Ethics · forty things that bring joy']
  - [Thirukkural, 'Ethics · 1,330 couplets']
  - [Thirikadukam, Ethics]
  - [Acharakkovai, 'Ethics · conduct']
  - [Pazhamozhi Nanuru, 'Ethics · built on proverbs']
  - [Sirupanchamulam, Ethics]
  - [Mudumozhikkanchi, Ethics]
  - [Elathi, Ethics]
  - [Kar Narpathu, 'Akam · the rainy season']
  - [Ainthinai Aimpathu, 'Akam · ten poems for each landscape']
  - [Ainthinai Ezhupathu, Akam]
  - [Thinaimozhi Aimpathu, Akam]
  - [Thinaimalai Nutraimpathu, Akam]
  - [Kainnilai, 'Akam · some lists name Innilai instead']
  - [Kalavazhi Narpathu, 'Puram · a battle']
- type: numgrid
  section: siddha
  title: The 18 Siddhars
  intro: 'Mystics, alchemists and physicians of the Siddha tradition. They mocked ritual and caste, and they sang of
    the divine within the body. The names in the list vary between sources; this is the list in the Abithana Chintamani.
    Siddha medicine still bears their name.'
  color: siddha
  items: [Nandi, Thirumoolar, Agastyar, Kalangi Nathar, Patanjali, Korakkar, Sundaranandar, Konganar, Sattaimuni, Valmiki
      (Vanmikar), Ramadevar, Dhanvantari, Idaikadar, Machamuni, Karuvoorar, Bogar, Pambatti, Kudhambai]
- type: cards
  section: siddha
  title: Four Siddhars to know
  grid: v4
  cards:
  - {title: Thirumoolar, native: திருமூலர், accent: siddha, body: 'His <em>Thirumantiram</em> of about 3,000 verses is the
      tenth book of the Saiva canon (Tirumurai). It holds the famous line "Love is God" (அன்பே சிவம்).'}
  - {title: Bogar, native: போகர், accent: siddha, body: 'Tradition credits him with the image of Murugan at <a href="muruga.html">Palani</a>,
      made of nine minerals (navapashanam).'}
  - {title: Karuvoorar, native: கருவூரார், accent: siddha, body: 'Linked by tradition with the building of the Brihadeeswara
      temple at Thanjavur, which keeps a shrine to him.'}
  - {title: Pambatti, native: பாம்பாட்டி, accent: siddha, body: 'The "snake-charmer" Siddhar. His songs urge the dancing
      snake, the soul, to rise.'}
