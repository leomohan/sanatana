  title: Tamil Literature — Sangam Anthologies, Thirukkural and the 18 Siddhars
  description: Classical Tamil poetry mapped. The Eight Anthologies and Ten Idylls of the Sangam age, the five landscapes
    of love poetry, the eighteen shorter works including the Thirukkural, and the 18 Siddhars.
