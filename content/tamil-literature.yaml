  primary: tamil
  h1: Tamil Literature
  intro: 'Two thousand years of Tamil poetry, from love lyrics coded by landscape to a book of 1,330 couplets on how
    to live. The oldest layer is the Sangam corpus: eight anthologies and ten long poems, eighteen works in all. Eighteen
    shorter works follow it, the Thirukkural among them. Running beside both are the songs of the Siddhars, the
    rebel mystics.'
