- type: callout
  text: '🏛️ <strong>Why "Sangam"?</strong> Later tradition tells of three academies of poets (<em>sangams</em>) that
    met in Pandya capitals over thousands of years. Scholars treat that chronology as legend, and most date the surviving
    poems to roughly 300 BCE–300 CE; Kamil Zvelebil favoured 100 BCE–250 CE. The grammar <em>Tolkappiyam</em> sets out
    the rules the poems follow.'
- {type: filters}
- type: cards
  title: The five landscapes of love
  intro: 'Akam poetry never names its lovers. Instead each poem is set in a landscape (<em>tinai</em>), and the landscape
    tells the reader which mood of love is meant. Each tinai is named after a flower.'
  section: akam
  grid: v4
  cards:
  - title: Kurinji
    native: குறிஞ்சி
    subtitle: Mountains
    accent: kurinji
    tags: akam
    corner_icon: ⛰️
    facts:
    - [Mood, Lovers' union]
    - [Deity, Murugan (Ceyon)]
  - title: Mullai
    native: முல்லை
    subtitle: Forests and pasture
    accent: mullai
    tags: akam
    corner_icon: 🌳
    facts:
