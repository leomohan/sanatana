- type: compare
  title: ⚖️ Side-by-Side Comparison
  color: astika
  intro: Scroll horizontally to see all six columns. Filter chips above can hide columns you don't need. Every row
    uses the same criteria across all schools.
  corner: Criterion
  columns:
  - {key: nyaya, label: Nyaya, color: nyaya}
  - {key: vaisheshika, label: Vaisheshika, color: vaisheshika}
  - {key: samkhya, label: Samkhya, color: samkhya}
