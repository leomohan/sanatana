- type: story
  title: Bhakti tells her own story
  paragraphs:
  - 'A verse in the <em>Bhagavata Mahatmya</em> of the Padma Purana gives Bhakti herself a voice, and she describes
    the very journey on this map:'
  - '<span lang="sa">उत्पन्ना द्राविडे साहं वृद्धिं कर्णाटके गता ।<br>क्वचित्क्वचिन्महाराष्ट्रे गुर्जरे जीर्णतां
    गता ॥</span><br><em>"I was born in the Dravida land and grew up in Karnataka. Here and there in Maharashtra I lived
    on, and in Gujarat I grew old."</em> The verses that follow have her made young again in Vrindavan.'
  - 'The Bhagavata itself (11.5.39) says that in the Kali age devotees of Narayana will appear "here and there, but
    in great numbers in the Dravida lands, where the Tamraparni flows". Historians tell the same story in their own
    terms: a devotional movement that began in the Tamil country between the 6th and 9th centuries and spread north
    over the next eight hundred years.'
