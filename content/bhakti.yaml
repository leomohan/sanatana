  h1: Bhakti Movements of India
  intro: 'Devotion sung in the language of the people, not the Sanskrit of the priests. It began with the Tamil Azhwars
    and Nayanmars, rose in Kannada and Marathi, and by the 15th and 16th centuries filled the north and east, from Kabir''s
    Varanasi to Chaitanya''s Bengal and Sankardev''s Assam. Here are twenty-five of its voices, numbered in order of
    time.'
