- type: story
  title: A curious alignment
  paragraphs: ['Three of the five — Srikalahasti (air), Kanchipuram (earth) and Chidambaram (space) — lie within
      about a hundredth of a degree of the same longitude, close to 79.7°E, across some 260 km from north to south.
      Visitors often remark on it; the texts that praise these temples do not mention it.', 'All five are also Paadal
      Petra Sthalams, sung by the Nayanmars in the Tevaram — see the <a href="an.html">Azhwars &amp; Nayanmars</a>
      and <a href="shiva-muruga.html">Shiva &amp; Muruga</a> pages.']
