  title: Pancha Bhoota Sthalams — Shiva as the Five Elements
  description: Interactive map of the five Pancha Bhoota Sthalams — Shiva temples for earth, water, fire, air and
    space at Kanchipuram, Thiruvanaikaval, Tiruvannamalai, Srikalahasti and Chidambaram.
  favicon: 🔥
  search: Search elements, temples, legends…
  native: ta
  palette:
    muruga: ['#ff9f43', '#b9770e']
    muruga-2: ['#a55eea', '#5f27cd']
  gradient: [muruga, muruga-2]
  primary: muruga
  h1: Pancha Bhoota Sthalams
  intro: 'Five Shiva temples in South India, each worshipped as one of the five elements (<em>pancha bhuta</em>)
    from which the world is made: earth, water, fire, air and space. Four are in Tamil Nadu; the air temple, Srikalahasti,
    is in Andhra Pradesh.'
