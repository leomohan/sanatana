    meta: [2 deities, 10 forms, Texts & Festivals]
  - title: Navagraha Temples
    accent: '#8854d0'
    href: navagraha.html
    emoji: 🪐
    text: Nine Shiva temples around Kumbakonam, each the seat of one of the nine Grahas — the pilgrimage that brings
