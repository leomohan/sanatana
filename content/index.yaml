    meta: [9 temples, Interactive map, Linked to Jyotisha]
  - title: Pancha Bhoota Sthalams
    accent: '#ee5253'
    href: pancha-bhoota.html
    emoji: 🔥
    text: Shiva as the five elements — earth at Kanchipuram, water at Thiruvanaikaval, fire at Tiruvannamalai, air
      at Srikalahasti and space at Chidambaram.
    meta: [5 elements, Interactive map, South India]
  - title: Shakti Peethas
    accent: '#e84393'
    href: shakti-peethas.html
    emoji: 🌺
    text: Where the body of Sati fell — the 18 Maha Shakti Peethas from Sri Lanka to Kashmir, the four Adi Peethas,
      and the legend of Daksha's sacrifice.
    meta: [18 + 4 peethas, Interactive map, Sati legend]
  - title: The Ramayana Journey
    accent: '#4a9eff'
    href: ramayana.html
    emoji: 🏹
    text: Rama's route from Ayodhya to Lanka and home, mapped stop by stop. At each stop, how Valmiki, Kamban
