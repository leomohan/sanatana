    meta: [4 poets, 16 works, Drama · Kavya · Prose]
  - title: When India Says “Ram”
    accent: '#c8860a'
    href: ram.html
    emoji: 🙏
    text: One name in twelve everyday expressions, from the greeting Ram Ram to Ram Naam Satya Hai, and what each says
