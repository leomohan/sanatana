    meta: [10 ragas, Plays in the browser, Adi Talam wheel]
  - title: Sanskrit Poets & Dramatists
    accent: '#a55eea'
    href: sanskrit-poets.html
    emoji: ✒️
    text: Bhasa, Kalidasa, Bhavabhuti and Banabhatta, the four great writers of classical Sanskrit, with their plays,
