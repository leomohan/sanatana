    meta: [18 composers, 72 melakartas, Linked to Raga Geometry]
  - title: Raga Geometry
    accent: '#e89a00'
    href: raga-geometry.html
    emoji: 🎡
    text: Carnatic raga and tala drawn to scale. Pick a raga, hear its ascent and descent over a drone, and follow
