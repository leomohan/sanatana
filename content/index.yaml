    meta: [7 generations, 5 houses, Search any name]
  - title: Dashavatara
    accent: '#2bcbba'
    href: dashavatara.html
    emoji: 🐚
    text: The ten avatars of Vishnu across the four yugas, from Matsya in the flood to Kalki still to come, and where
      the lists disagree.
    meta: [10 avatars, 4 yugas, Lists compared]
  - title: Carnatic Music
    accent: '#ff9f43'
    href: carnatic.html
    emoji: 🎶
    text: Five centuries of composers on one timeline, the Trinity of Tiruvarur, and all 72 melakarta ragas laid out
