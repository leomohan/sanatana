  - title: Guru Parampara
    accent: '#ff9f43'
    href: parampara.html
    emoji: 🪔
    text: Teacher–disciple lineages as timelines. All 36 Jagadgurus of Sringeri, the Sri Vaishnava acharyas around Ramanuja,
