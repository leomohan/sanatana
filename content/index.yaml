    meta: [13 stops, Route map, Three poets compared]
  - title: The Mahabharata Family Tree
    accent: '#ff6b6b'
    href: mahabharata.html
    emoji: ⚔️
    text: Seven generations from Shantanu to Janamejaya, with the Yadava, Panchala and Gandhara houses that married
