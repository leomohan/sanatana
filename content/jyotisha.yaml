- type: table
  title: ✨ The Twenty-Seven Nakshatras (Lunar Mansions)
  color: nakshatra
  section: nakshatra
  intro: The Moon passes through 27 lunar mansions, each spanning 13°20′ of the ecliptic. Every Nakshatra has a
    ruling planet, a presiding deity, and a symbol.
  columns: [Nakshatra, Ruling Planet, Presiding Deity, Symbol]
  rows:
  - [Ashwini, Ketu, Ashwini Kumaras, Horse's head]
  - [Bharani, Shukra (Venus), Yama, Yoni]
  - [Krittika, Surya (Sun), Agni, Knife]
  - [Rohini, Chandra (Moon), Brahma, 'Cart, temple']
  - [Mrigashira, Mangala (Mars), Soma, Deer's head]
  - [Ardra, Rahu, Rudra, Teardrop]
  - [Punarvasu, Guru (Jupiter), Aditi, Bow and quiver]
  - [Pushya, Shani (Saturn), Brihaspati, 'Cow''s udder, lotus']
  - [Ashlesha, Budha (Mercury), Nagas, Serpent]
  - [Magha, Ketu, Pitris, Royal throne]
  - [Purva Phalguni, Shukra (Venus), Bhaga, Front legs of bed]
  - [Uttara Phalguni, Surya (Sun), Aryaman, Back legs of bed]
  - [Hasta, Chandra (Moon), Savitr, Hand]
  - [Chitra, Mangala (Mars), Vishwakarma, Bright jewel]
  - [Swati, Rahu, Vayu, Shoot of plant]
  - [Vishakha, Guru (Jupiter), Indra-Agni, Triumphal arch]
  - [Anuradha, Shani (Saturn), Mitra, Lotus]
  - [Jyeshtha, Budha (Mercury), Indra, Circular amulet]
  - [Mula, Ketu, Nirriti, Bunch of roots]
  - [Purva Ashadha, Shukra (Venus), Apas, Elephant tusk]
  - [Uttara Ashadha, Surya (Sun), Vishvedevas, Elephant tusk]
  - [Shravana, Chandra (Moon), Vishnu, 'Ear, three footprints']
  - [Dhanishtha, Mangala (Mars), Eight Vasus, Drum]
  - [Shatabhisha, Rahu, Varuna, Empty circle]
  - [Purva Bhadrapada, Guru (Jupiter), Aja Ekapada, Swords]
  - [Uttara Bhadrapada, Shani (Saturn), Ahir Budhnya, 'Twins, snake']
  - [Revati, Budha (Mercury), Pushan, Pair of fish]
- type: cards
  title: 📅 The Panchanga (Five Limbs of Time)
  color: panchanga
  section: panchanga
  intro: The Panchanga is the traditional Hindu almanac — its name means "five limbs" because it tracks five aspects
    of time based on the Moon's motion. Nakshatra is one of the five; the others are how people use the sky every
    day.
  grid: v3
  cards:
  - {id: tithi, title: Tithi, native: तिथि, subtitle: Lunar Day, accent: panchanga, tags: panchanga, body: 'The
      time for the Moon-Sun longitude gap to grow by 12°. There are 30 Tithis in a lunar month, divided into Shukla
      Paksha (waxing) and Krishna Paksha (waning).'}
  - {id: vara, title: Vara, native: वार, subtitle: Weekday, accent: panchanga, tags: panchanga, body: 'The seven
      days of the week, each ruled by a Graha: Ravi (Sun), Soma (Moon), Mangala (Mars), Budha (Mercury), Guru (Jupiter),
      Shukra (Venus), Shani (Saturn).'}
  - {id: nakshatra, title: Nakshatra, native: नक्षत्र, subtitle: Lunar Mansion, accent: panchanga, tags: panchanga,
    body: 'The Moon''s transit through one of the 27 lunar mansions on a given day. Used for naming children, scheduling
      ceremonies, and matching compatibility.'}
  - {id: yoga, title: Yoga, native: योग, subtitle: Sun-Moon Combination, accent: panchanga, tags: panchanga, body: A
      calculation based on the sum of the Sun and Moon's longitudes. There are 27 Yogas; some are considered auspicious
      and others inauspicious for specific activities.}
  - {id: karana, title: Karana, native: करण, subtitle: Half-Tithi, accent: panchanga, tags: panchanga, body: Half
      of a lunar day; two Karanas per Tithi. There are 11 Karanas in total. The Vishti (Bhadra) Karana is avoided
      for auspicious ceremonies.}
- type: numgrid
  title: 🔄 The Sixty Samvatsaras (Jovian Year Cycle)
  color: samvatsara
  section: samvatsara
  intro: A cycle of 60 named years, traditionally linked to Jupiter's movement (in South Indian calendars it simply
    runs with the solar or lunar year). The names repeat every 60 years, divided into three groups of 20 attributed
    to Brahma, Vishnu, and Shiva. Regional lists vary slightly in spelling.
  items: [Prabhava, Vibhava, Shukla, Pramoda, Prajapati, Angirasa, Shrimukha, Bhava, Yuvan, Dhatri, Ishvara, Bahudhanya,
    Pramathin, Vikrama, Vrisha, Chitrabhanu, Svabhanu, Tarana, Parthiva, Vyaya, Sarvajit, Sarvadharin, Virodhin,
    Vikrita, Khara, Nandana, Vijaya, Jaya, Manmatha, Durmukha, Hemalambin, Vilambin, Vikarin, Sharvari, Plava, Shubhakrit,
    Shobhana, Krodhin, Vishvavasu, Parabhava, Plavanga, Kilaka, Saumya, Sadharaṇa, Virodhikrit, Paritapin, Pramadin,
    Ananda, Rakshasa, Anala, Pingala, Kalayukti, Siddharthin, Raudra, Durmati, Dundubhi, Rudhirodgarin, Raktaksha,
    Krodhana, Akshaya]
