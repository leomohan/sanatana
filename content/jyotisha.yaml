- type: cards
  title: 🪐 The Nine Grahas (Planetary Rulers)
  color: graha
  section: graha
  intro: The Navagraha are the governors of the sky — every Rashi and Nakshatra is ruled by one of them. They are
    worshipped as deities and their positions shape the birth chart (Kundali). Each Graha has its own temple in
    the Kaveri delta — see the <a href="navagraha.html" style="color:var(--graha);font-weight:600">Navagraha Temples</a>
    map.
  grid: v3
  cards:
  - id: surya
    title: Surya
    native: सूर्य
    subtitle: Sun
    accent: graha
    tags: graha
    body: The head of the Navagrahas. Rules the soul, vitality, authority, and the father. Exalted in Mesha (Aries).
    facts:
    - [Rules, Simha (Leo)]
    - [Nature, Malefic (mildly)]
    - [Temple, '<a href="navagraha.html#surya" style="color:inherit;font-weight:600">🛕 Suryanar Kovil →</a>']
    chips:
    - {text: ☀️ Sun, style: theme}
  - id: chandra
    title: Chandra
    native: चन्द्र
    subtitle: Moon
    accent: graha
    tags: graha
    body: Rules the mind, emotions, and the mother. The Moon's position defines the Rashi (Janma Rashi) and the
      Nakshatra of birth.
    facts:
    - [Rules, Karka (Cancer)]
    - [Nature, Benefic]
    - [Temple, '<a href="navagraha.html#chandra" style="color:inherit;font-weight:600">🛕 Thingalur →</a>']
    chips:
    - {text: 🌙 Moon, style: theme}
  - id: mangala
    title: Mangala
    native: मङ्गल
    subtitle: Mars
    accent: graha
    tags: graha
    body: Rules courage, energy, conflict, and the siblings. Exalted in Makara (Capricorn).
    facts:
    - [Rules, 'Mesha, Vrischika']
    - [Nature, Malefic]
    - [Temple, '<a href="navagraha.html#mangala" style="color:inherit;font-weight:600">🛕 Vaitheeswaran Koil →</a>']
    chips:
    - {text: 🔴 Mars, style: theme}
  - id: budha
    title: Budha
    native: बुध
    subtitle: Mercury
    accent: graha
    tags: graha
    body: Rules intellect, communication, and commerce. Exalted in Kanya (Virgo).
    facts:
    - [Rules, 'Mithuna, Kanya']
    - [Nature, Benefic (with benefics)]
    - [Temple, '<a href="navagraha.html#budha" style="color:inherit;font-weight:600">🛕 Thiruvenkadu →</a>']
    chips:
    - {text: 🟢 Mercury, style: theme}
  - id: guru
    title: Guru (Brihaspati)
    native: गुरु
    subtitle: Jupiter
    accent: graha
    tags: graha
    body: The teacher of the gods. Rules wisdom, dharma, expansion, and fortune. Exalted in Karka (Cancer).
    facts:
    - [Rules, 'Dhanus, Meena']
    - [Nature, Benefic]
    - [Temple, '<a href="navagraha.html#guru" style="color:inherit;font-weight:600">🛕 Alangudi →</a>']
    chips:
    - {text: 🟡 Jupiter, style: theme}
  - id: shukra
    title: Shukra
    native: शुक्र
    subtitle: Venus
    accent: graha
    tags: graha
    body: Rules love, beauty, art, and pleasure. Exalted in Meena (Pisces).
    facts:
    - [Rules, 'Vrishabha, Tula']
    - [Nature, Benefic]
    - [Temple, '<a href="navagraha.html#shukra" style="color:inherit;font-weight:600">🛕 Kanjanur →</a>']
    chips:
    - {text: 💎 Venus, style: theme}
  - id: shani
    title: Shani
    native: शनि
    subtitle: Saturn
    accent: graha
    tags: graha
    body: Rules discipline, karma, delay, and endurance. Exalted in Tula (Libra). The great teacher through hardship.
    facts:
    - [Rules, 'Makara, Kumbha']
    - [Nature, Malefic]
    - [Temple, '<a href="navagraha.html#shani" style="color:inherit;font-weight:600">🛕 Thirunallar →</a>']
    chips:
    - {text: 🔵 Saturn, style: theme}
  - id: rahu
    title: Rahu
    native: राहु
    subtitle: North Lunar Node
    accent: graha
    tags: graha
    body: The eclipse-causing node. Rules illusion, ambition, and the unconventional. Always retrograde.
    facts:
    - [Rules, Kumbha (co-ruler)]
    - [Nature, Malefic]
    - [Temple, '<a href="navagraha.html#rahu" style="color:inherit;font-weight:600">🛕 Thirunageswaram →</a>']
    chips:
    - {text: 🐍 Rahu, style: theme}
  - id: ketu
    title: Ketu
    native: केतु
    subtitle: South Lunar Node
    accent: graha
    tags: graha
    body: Rules detachment, spirituality, and liberation. The headless node that points toward moksha.
    facts:
    - [Rules, Vrischika (co-ruler)]
    - [Nature, Malefic]
    - [Temple, '<a href="navagraha.html#ketu" style="color:inherit;font-weight:600">🛕 Keezhperumpallam →</a>']
    chips:
    - {text: ☄️ Ketu, style: theme}
- type: cards
