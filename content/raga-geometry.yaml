page:
  file: raga-geometry.html
  layout: page
  title: Raga Geometry — Carnatic Raga and Tala, Drawn to Scale
  description: An interactive raga wheel and Adi Talam wheel. Pick a raga, hear its ascent and descent over a drone,
    and watch both wheels move.
  favicon: 🎡
  scripts: [raga.js]
  palette:
    aro: ['#ffb52e', '#e89a00']
    aro-ink: ['#ffc24d', '#a86400']
    avaro: ['#ff4f9a', '#e0207a']
    laghu: ['#3db5f0', '#0088c8']
    dru1: ['#5fd12a', '#2f9e00']
    dru2: ['#ff8a3d', '#ee5f00']
  gradient: [aro, avaro, laghu]
  primary: aro
  h1: Raga Geometry
  intro: Carnatic raga and tala, drawn to scale. Pick a raga, press play and watch both wheels move. The twelve notes
    of the octave sit around the circle with Sa at the top. Each raga's ascent and descent are traced as paths between
    them.
  footer: ['🎡 Raga Geometry · pitches use just-intonation ratios with Sa set to C (261.6 Hz), over a Sa–Pa drone',
    'Mood associations are traditional and vary between schools']
blocks:
- type: callout
  text: '🎶 Every scale here comes from one of the <a href="carnatic.html#melakartas">72 melakartas</a>. The chart there
    links back to each raga you can hear on this page. The composers who made these ragas famous are on the <a href="carnatic.html">Carnatic
    music page</a>.'
- type: raga-geometry
  note: In performance every raga also carries gamakas, the oscillations and slides between notes, which no scale drawing
    can show. Treat each wheel as the raga's skeleton. Your browser plays the sound itself, so turn the volume up
    and press play.
  ragas:
  - id: shankarabharanam
    name: Shankarabharanam
    tag: MELA 29
    parent: Melakarta 29 · Dheerashankarabharanam
    aro: [S, R2, G3, M1, P, D2, N3, "S'"]
    avaro: reverse
    mood: Majesty and grandeur
    note: Same intervals as the Western major scale. A large-canvas raga, favoured for long alapanas and ragam–tanam–pallavi.
  - id: kalyani
    name: Kalyani
    tag: MELA 65
    parent: Melakarta 65 · Mechakalyani
    aro: [S, R2, G3, M2, P, D2, N3, "S'"]
    avaro: reverse
    mood: Auspicious and uplifting
    note: The only raga in this list with prati madhyamam (M2), the raised Ma. Every melakarta from 37 to 72 uses M2,
      and Kalyani is the best known of them.
  - id: todi
    name: Todi
    tag: MELA 8
    parent: Melakarta 8 · Hanumatodi
    aro: [S, R1, G2, M1, P, D1, N2, "S'"]
    avaro: reverse
    mood: Pathos (karuna) and devotion
    note: Todi lives in its heavy gamakas on G2 and D1, which a scale drawing cannot show. It is widely regarded as one
      of the most demanding ragas to render.
  - id: kharaharapriya
    name: Kharaharapriya
    tag: MELA 22
    parent: Melakarta 22 · Kharaharapriya
    aro: [S, R2, G2, M1, P, D2, N2, "S'"]
    avaro: reverse
    mood: Compassion and devotion; calm and expansive
    note: Parent scale of many popular janya ragas, including Madhyamavati, Abhogi and Sriranjani.
  - id: bhairavi
    name: Bhairavi
    tag: JANYA OF 20
    parent: Janya of Melakarta 20 · Natabhairavi
    aro: [S, R2, G2, M1, P, D2, N2, "S'"]
    avaro: ["S'", N2, D1, P, M1, G2, R2, S]
    mood: Devotion, pathos and majesty
    note: 'A bhashanga raga: it borrows D2 on the way up, while the parent''s D1 returns on the way down. Look for the
      two different Da positions on the wheel.'
  - id: kambhoji
    name: Kambhoji
    tag: JANYA OF 28
    parent: Janya of Melakarta 28 · Harikambhoji
    aro: [S, R2, G3, M1, P, D2, "S'"]
    avaro: ["S'", N2, D2, P, M1, G3, R2, S]
    mood: Heroism (vira), devotion and grandeur
    note: Skips Ni going up (six notes up, seven down). Kakali nishadam (N3) also appears as a foreign note in phrases
      such as N3 P D S; this chart shows only the core scale.
  - id: mayamalavagowla
    name: Mayamalavagowla
    tag: MELA 15
    parent: Melakarta 15 · Mayamalavagowla
    aro: [S, R1, G3, M1, P, D1, N3, "S'"]
    avaro: reverse
    mood: Devotional and serene; associated with early morning
    note: 'The first raga a student learns: Purandara Dasa set the basic sarali varisai exercises in it. Note the wide
      gaps from R1 to G3 and from D1 to N3.'
  - id: mohanam
    name: Mohanam
    tag: JANYA OF 28
    parent: Janya of Melakarta 28 · Harikambhoji
    aro: [S, R2, G3, P, D2, "S'"]
    avaro: reverse
    mood: Joy and romance (shringara)
    note: Five notes each way (audava), with no Ma or Ni. Same intervals as the major pentatonic heard in folk music around
      the world.
  - id: hamsadhwani
    name: Hamsadhwani
    tag: JANYA OF 29
    parent: Janya of Melakarta 29 · Dheerashankarabharanam
    aro: [S, R2, G3, P, N3, "S'"]
    avaro: reverse
    mood: Bright and auspicious; a favourite concert opener
    note: Created by Ramaswami Dikshitar. Vatapi Ganapatim, by his son Muthuswami Dikshitar, is the best-known composition
      in it.
  - id: madhyamavati
    name: Madhyamavati
    tag: JANYA OF 22
    parent: Janya of Melakarta 22 · Kharaharapriya
    aro: [S, R2, M1, P, N2, "S'"]
    avaro: reverse
    mood: Auspicious; traditionally closes a concert
    note: Five notes, with no Ga or Da. Concerts customarily end with a mangalam sung in this raga.
