# Site-wide settings. Add a page here once and it appears in every footer.
name: Sanatana
tagline: visual maps of Hindu literature, philosophy and saints
leaflet_version: 1.9.4
# --- Search and sharing ---
# The live address. Canonical links, the sitemap, robots.txt and llms.txt are built from it;
# change it here if the site moves to its own domain.
url: https://sanatanadharma.pages.dev
description: Interactive visual maps of Hindu literature, philosophy, saints, temples and festivals.
# Shown when a page is shared (WhatsApp, LinkedIn, X...). A page uses assets/og/<page>.jpg if it exists.
og_image: assets/og/index.jpg
# Paste the codes from Google Search Console and Bing Webmaster Tools (the content="..." part of their meta tag).
verify_google: ''
verify_bing: ''
# Home page topic groups: the menu at the top of the home page and the card sections below it.
# Every page in nav (except Home) must be listed in exactly one group; the build stops otherwise.
groups:
  - key: texts
    emoji: 📜
    label: Texts & philosophy
    intro: The scriptures, the epics and the schools of thought built on them.
    pages: [veda.html, gita.html, darshanas.html, vedanta.html, shanmata.html, ramayana.html, mahabharata.html, dashavatara.html]
  - key: saints
    emoji: 🪔
    label: Saints & lineages
    intro: Poet-saints, teachers and the lines that carried their teaching down the centuries.
    pages: [an.html, bhakti.html, parampara.html, mathas.html, sanskrit-poets.html, tamil-literature.html]
  - key: places
    emoji: 🛕
    label: Sacred places
    intro: Temples, pilgrim circuits and how the temples were built.
    pages: [geography.html, muruga.html, navagraha.html, pancha-bhoota.html, shakti-peethas.html, temples.html, shiva-muruga.html]
  - key: time
    emoji: 🌌
    label: Time, sky & ritual
    intro: The stars, the calendar and the rites that mark a life.
    pages: [jyotisha.html, festivals.html, samskaras.html]
  - key: music
    emoji: 🎶
    label: Music & language
    intro: Raga, song and the name of Ram in everyday speech.
    pages: [carnatic.html, raga-geometry.html, ram.html]
nav:
