  h1: Navagraha Temples
  intro: Nine temples in the Kaveri delta around Kumbakonam, each the seat of one of the nine Grahas of <a href="jyotisha.html"
    style="color:inherit;text-decoration:underline">Jyotisha</a>. Except at Suryanar Kovil, the main deity is Shiva
    and the Graha has its own shrine within the temple. Built and enlarged under the Cholas, they are visited together
    as one pilgrimage.
